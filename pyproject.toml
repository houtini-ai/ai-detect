[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-detect"
dynamic = ["version"]
description = "Local AI-text detection: per-sentence scores from open detectors, pattern diagnostics, a CLI, an MCP server and a local web UI."
readme = "README.md"
# Current torch, transformers and onnxruntime all require Python 3.11+
# (PyPI requires_python, read 24 Nov 2026).
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "ai_detect/_vendor/LICENSE-conpara"]
authors = [{ name = "Richard Baxter", email = "richard@houtini.com" }]
keywords = ["ai-detection", "ai-text-detector", "deberta", "modernbert", "raid", "mcp", "mcp-server", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "torch>=2.6",
    # ONNX Runtime runs the default model (gpttrace-150m) and the other two
    # ONNX models (light, gpttrace-1b). This is the CPU build. Do not install
    # onnxruntime-directml or onnxruntime-gpu beside it: all three ship the
    # same `onnxruntime` package folder and overwrite each other (see the
    # gpu-directml note below).
    "onnxruntime>=1.20",
    "transformers>=4.48",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    # Both SDK lines are supported: 1.x (mcp.server.fastmcp.FastMCP) and
    # 2.x (mcp.server.mcpserver.MCPServer). See ai_detect/server.py.
    "mcp>=1.10,<3",
    # Used directly: blocking detection is run off the event loop.
    "anyio>=4.0",
    # The local web UI. Both are already dependencies of the MCP SDK.
    "starlette>=0.40",
    "uvicorn>=0.31",
]

[project.optional-dependencies]
# ONNX Runtime is a core dependency since the default model needs it. These two
# names are kept as aliases that add nothing, so `pip install ".[light]"` from
# older instructions still works.
light = ["onnxruntime>=1.20"]
onnx = ["onnxruntime>=1.20"]
# Kept as a name only; it installs nothing. Up to 1.0.0 it installed
# onnxruntime-directml. With the CPU build now a core dependency that would put
# two distributions of the `onnxruntime` package in one environment, and the
# CPU one wins (checked 25 Nov 2026: providers were Azure and CPU only). To run
# the ONNX models on a GPU, replace the build after installing ai-detect:
#     pip uninstall -y onnxruntime
#     pip install --force-reinstall onnxruntime-directml   (Windows, DirectML)
#     pip install --force-reinstall onnxruntime-gpu        (NVIDIA CUDA)
gpu-directml = []
# The DeBERTa-ConPara model needs a SentencePiece tokenizer.
conpara = ["sentencepiece>=0.2", "protobuf>=5"]
# URL input: fetch and render a page with headless Chromium.
# After installing, run once:  playwright install chromium
web = ["playwright>=1.48"]
all = ["sentencepiece>=0.2", "protobuf>=5", "playwright>=1.48"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/houtini-ai/ai-detect"
Repository = "https://github.com/houtini-ai/ai-detect"
"Built by" = "https://houtini.com"

[project.scripts]
ai-detect = "ai_detect.cli:main"
ai-detect-mcp = "ai_detect.server:main"

[tool.setuptools.dynamic]
version = { attr = "ai_detect._version.__version__" }

[tool.setuptools.packages.find]
include = ["ai_detect*"]

[tool.setuptools.package-data]
ai_detect = ["web/static/*", "_vendor/LICENSE-conpara", "assets/*.js", "calibration.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright and Chromium", "model: downloads and runs a real model"]
